[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iconify-tool"
version = "0.1.0"
description = "A pro-level image-to-icon tool with a GUI and command-line interface."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Iconify contributors" }]
keywords = ["ico", "icon", "image", "converter", "gui"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Environment :: X11 Applications",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
  "Pillow>=10.3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pyinstaller>=6.6",
  "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/blahpunk/Iconify"
Issues = "https://github.com/blahpunk/Iconify/issues"

[project.scripts]
iconify = "iconify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
