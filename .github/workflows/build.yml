name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . -r requirements-dev.txt
      - run: ruff check .
      - run: python -m iconify --help

  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: .\scripts\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: iconify-windows
          path: dist/**

  package-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: chmod +x scripts/build_ubuntu.sh && ./scripts/build_ubuntu.sh
      - uses: actions/upload-artifact@v4
        with:
          name: iconify-ubuntu
          path: dist/*.deb

